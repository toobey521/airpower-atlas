<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球空军图鉴 · AIRPOWER - Toobey</title>
<style>
:root{
  --bg:#0a0f1a; --bg2:#0e1626; --card:#111c30; --card2:#16233c;
  --line:#1e2f4d; --txt:#e8eef7; --dim:#8fa3bf; --dim2:#5c718f;
  --accent:#00d4ff; --accent2:#4f9cff;
  --cn:#ffd700; --us:#4f9cff; --ru:#ff5252; --eu:#9c6bff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--txt); min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,212,255,.08), transparent),
    radial-gradient(ellipse 60% 40% at 90% 110%, rgba(79,156,255,.06), transparent),
    linear-gradient(rgba(0,212,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,.025) 1px, transparent 1px);
  background-size:auto,auto,42px 42px,42px 42px;
}
/* ===== 顶部 ===== */
header{
  position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
  background:rgba(10,15,26,.82); border-bottom:1px solid var(--line);
}
.hd-inner{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo-ico{
  width:44px;height:44px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,#00d4ff,#4f9cff);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 22px rgba(0,212,255,.4);
}
.logo-ico svg{width:26px;height:26px}
.logo h1{font-size:20px;letter-spacing:2px;font-weight:700}
.logo h1 em{font-style:normal;color:var(--accent)}
.logo p{font-size:11px;color:var(--dim2);letter-spacing:3px;margin-top:2px}
.search{margin-left:auto;position:relative}
.search input{
  width:230px;padding:10px 14px 10px 38px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);color:var(--txt);font-size:13px;outline:none;transition:.25s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,255,.12)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.5}
/* ===== 统计条 ===== */
.stats{max-width:1280px;margin:18px auto 0;padding:0 20px;display:flex;gap:14px;flex-wrap:wrap}
.stat{
  flex:1;min-width:140px;background:linear-gradient(160deg,var(--card),var(--bg2));
  border:1px solid var(--line);border-radius:14px;padding:14px 18px;position:relative;overflow:hidden;
}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
.stat .n{font-size:26px;font-weight:800;color:var(--accent);font-family:'Courier New',monospace}
.stat .t{font-size:12px;color:var(--dim);margin-top:2px;letter-spacing:1px}
/* ===== 筛选 ===== */
.filters{max-width:1280px;margin:18px auto 0;padding:0 20px}
.f-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.f-label{font-size:12px;color:var(--dim2);letter-spacing:2px;margin-right:6px;flex:none}
.chip{
  padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--dim);font-size:13px;cursor:pointer;transition:.2s;user-select:none;flex:none;
}
.chip:hover{border-color:var(--accent);color:var(--txt)}
.chip.active{background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(79,156,255,.14));border-color:var(--accent);color:var(--accent);font-weight:600}
.f-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.f-scroll::-webkit-scrollbar{height:4px}
.f-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
select.country{
  padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);font-size:13px;outline:none;cursor:pointer;max-width:200px;
}
select.country:focus{border-color:var(--accent)}
select.country option{background:var(--bg2);color:var(--txt)}
/* AI生成中徽标 */
.gen-badge{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(160deg,rgba(14,22,38,.92),rgba(10,15,26,.96));z-index:2;
}
.gen-badge.show{display:flex}
.gen-ring{
  width:44px;height:44px;border-radius:50%;border:3px solid rgba(0,212,255,.15);
  border-top-color:var(--accent);animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-badge b{font-size:12px;color:var(--accent);letter-spacing:2px;font-weight:600}
.gen-badge span{font-size:10px;color:var(--dim2);letter-spacing:1px}
/* ===== 卡片网格 ===== */
.grid{max-width:1280px;margin:20px auto 70px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{
  background:linear-gradient(170deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:16px;overflow:hidden;cursor:pointer;transition:.3s;position:relative;
  animation:fadeUp .5s ease backwards;
}
.card:hover{transform:translateY(-6px);border-color:rgba(0,212,255,.5);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 24px rgba(0,212,255,.08)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.img-wrap{position:relative;aspect-ratio:16/10;overflow:hidden;background:#0a0f1a}
.img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .img-wrap img{transform:scale(1.06)}
.img-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,15,26,.92))}
.c-flag{
  position:absolute;top:12px;left:12px;z-index:2;padding:4px 10px;border-radius:8px;
  font-size:11px;font-weight:700;letter-spacing:1px;backdrop-filter:blur(6px);
}
.c-type{
  position:absolute;top:12px;right:12px;z-index:2;padding:4px 10px;border-radius:8px;
  font-size:11px;background:rgba(10,15,26,.7);border:1px solid var(--line);color:var(--dim);
  backdrop-filter:blur(6px);
}
.c-info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 16px}
.c-name{font-size:19px;font-weight:800;letter-spacing:1px}
.c-name small{display:block;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:1px;margin-top:2px}
.c-specs{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--dim)}
.c-specs b{color:var(--accent);font-family:'Courier New',monospace}
.c-cmp{
  position:absolute;top:46px;right:12px;z-index:3;width:26px;height:26px;border-radius:8px;
  border:1.5px solid rgba(30,47,77,.7);background:rgba(10,15,26,.3);opacity:.55;cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:.2s;backdrop-filter:blur(6px);
}
.c-cmp:hover{border-color:var(--accent);opacity:1;background:rgba(10,15,26,.7)}
.c-cmp.on{background:var(--accent);border-color:var(--accent);opacity:1}
.c-cmp svg{width:14px;height:14px;stroke:var(--txt);display:none}
.c-cmp.on svg{display:block}
.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:var(--dim2);font-size:15px;letter-spacing:2px}
/* ===== 详情弹窗 ===== */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(4,8,16,.85);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.detail{
  width:min(980px,100%);max-height:92vh;overflow-y:auto;border-radius:20px;
  background:linear-gradient(170deg,var(--card2),var(--bg2));border:1px solid var(--line);
  animation:pop .3s;position:relative;
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.d-close{
  position:sticky;top:14px;margin-left:auto;margin-right:14px;display:block;z-index:5;
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(10,15,26,.8);
  color:var(--dim);font-size:18px;cursor:pointer;transition:.2s;
}
.d-close:hover{color:var(--txt);border-color:var(--accent);transform:rotate(90deg)}
.d-body{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.d-img{position:relative;min-height:320px}
.d-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d-img::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,rgba(14,22,38,.9))}
.d-main{padding:26px 28px 28px}
.d-flag{display:inline-block;padding:3px 10px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:1px}
.d-name{font-size:30px;font-weight:800;margin:10px 0 2px;letter-spacing:2px}
.d-en{font-size:13px;color:var(--dim);letter-spacing:1px;margin-bottom:14px}
.d-desc{font-size:13.5px;line-height:1.9;color:#c3d2e6;margin-bottom:16px}
.d-desc p{margin-bottom:10px}
.d-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tag{font-size:11px;padding:4px 11px;border-radius:999px;border:1px solid rgba(0,212,255,.35);color:var(--accent);background:rgba(0,212,255,.06)}
table{width:100%;border-collapse:collapse;font-size:13px}
tr{border-bottom:1px solid rgba(30,47,77,.5)}
td{padding:9px 6px}
td:first-child{color:var(--dim);width:96px;letter-spacing:1px}
td:last-child{color:var(--txt);font-weight:500}
/* 详情翻页 */
.d-nav{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:22px;padding-top:16px;border-top:1px solid rgba(30,47,77,.5);
}
.d-nav-btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:13px;
  cursor:pointer;transition:.2s;letter-spacing:1px;
}
.d-nav-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.06)}
.d-nav-btn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--dim2);background:var(--bg2)}
.d-nav-btn svg{width:14px;height:14px}
.d-nav-ind{
  font-size:13px;color:var(--dim);letter-spacing:2px;font-family:'Courier New',monospace;
  display:flex;align-items:center;gap:8px;
}
.d-nav-ind b{color:var(--accent);font-size:15px}
.d-nav-kbd{font-size:10px;color:var(--dim2);letter-spacing:1px;border:1px solid var(--line);padding:2px 6px;border-radius:5px;background:var(--bg2)}
/* ===== 对比条 ===== */
.cmpbar{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);z-index:90;
  background:rgba(14,22,38,.95);border:1px solid var(--accent);border-radius:16px;padding:12px 16px;
  display:flex;align-items:center;gap:14px;transition:.35s cubic-bezier(.2,.9,.3,1.2);
  box-shadow:0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(10px);
}
.cmpbar.show{transform:translateX(-50%) translateY(0)}
.cmpbar .thumbs{display:flex;gap:8px}
.cmpbar .thumb{position:relative;width:52px;height:52px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.cmpbar .thumb img{width:100%;height:100%;object-fit:cover}
.cmpbar .thumb i{
  position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ff5252;
  color:#fff;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.cmpbar .go{padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121a;transition:.2s}
.cmpbar .go:hover{filter:brightness(1.15);transform:scale(1.04)}
.cmpbar .go:disabled{opacity:.4;cursor:not-allowed}
/* ===== 对比弹窗 ===== */
.cmp-table{width:min(1100px,100%);max-height:88vh;overflow:auto;border-radius:20px;
  background:linear-gradient(170deg,var(--card2),var(--bg2));border:1px solid var(--line);padding:24px 24px 28px;animation:pop .3s;position:relative}
.cmp-close{
  position:sticky;float:right;top:0;z-index:5;
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(10,15,26,.8);
  color:var(--dim);font-size:16px;cursor:pointer;transition:.2s;margin-left:auto;
}
.cmp-close:hover{color:var(--txt);border-color:var(--accent);transform:rotate(90deg)}
.cmp-table h3{font-size:18px;letter-spacing:2px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.cmp-table h3::before{content:'';width:4px;height:18px;background:var(--accent);border-radius:2px}
.cmp-table table{width:100%;font-size:13px}
.cmp-table th{position:sticky;top:0;background:var(--bg2);padding:12px 10px;text-align:center;letter-spacing:1px;border-bottom:2px solid var(--line)}
.cmp-table td{padding:11px 10px;text-align:center}
.cmp-table td:first-child{text-align:left;font-weight:600;color:var(--dim);width:110px;letter-spacing:1px}
.cmp-table tr:hover td{background:rgba(0,212,255,.03)}
.cmp-table .cn{color:var(--cn)}.cmp-table .us{color:var(--us)}.cmp-table .ru{color:var(--ru)}.cmp-table .eu{color:var(--eu)}
/* ===== 开场大屏 ===== */
.splash{
  position:fixed;inset:0;z-index:200;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:#04080f;transition:opacity .8s ease,visibility .8s;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:brightness(.75) saturate(1.15);transform:scale(1.02);
}
.splash::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, transparent 0%, rgba(4,8,15,.35) 70%, rgba(4,8,15,.88) 100%),
    linear-gradient(180deg, rgba(4,8,15,.5) 0%, transparent 30%, transparent 70%, rgba(4,8,15,.85) 100%);
}
.splash-body{position:relative;z-index:2;text-align:center;padding:20px;max-width:900px;width:100%}
.splash-tag{
  display:inline-block;font-size:12px;letter-spacing:6px;color:rgba(0,212,255,.85);
  border:1px solid rgba(0,212,255,.35);padding:7px 22px;border-radius:999px;margin-bottom:26px;
  background:rgba(0,212,255,.06);backdrop-filter:blur(6px);animation:fadeUp 1s .2s ease backwards;
}
.splash-title{
  font-size:clamp(38px,7vw,84px);font-weight:900;letter-spacing:12px;line-height:1.15;
  background:linear-gradient(180deg,#fff 20%,#9adcff 55%,#00d4ff 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 60px rgba(0,212,255,.35);animation:fadeUp 1.1s .5s ease backwards;
}
.splash-sub{
  font-size:clamp(13px,2vw,19px);letter-spacing:14px;color:#cfe7ff;margin-top:16px;
  font-weight:600;animation:fadeUp 1.1s .8s ease backwards;
}
.splash-brand{
  margin-top:14px;font-size:12px;letter-spacing:5px;color:rgba(255,215,0,.9);
  animation:fadeUp 1.1s 1s ease backwards;
}
.splash-brand b{font-size:16px;letter-spacing:4px}
.splash-line{
  width:min(420px,70vw);height:1px;margin:30px auto;position:relative;
  background:linear-gradient(90deg,transparent,rgba(0,212,255,.6),transparent);
  animation:lineGrow 1.2s 1.1s ease backwards;
}
@keyframes lineGrow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.splash-enter{
  display:inline-flex;align-items:center;gap:10px;padding:15px 46px;border-radius:999px;border:none;cursor:pointer;
  font-size:16px;font-weight:800;letter-spacing:4px;color:#04121a;
  background:linear-gradient(135deg,#00d4ff,#4f9cff);
  box-shadow:0 0 34px rgba(0,212,255,.45),inset 0 0 0 1px rgba(255,255,255,.25);
  animation:fadeUp 1.1s 1.4s ease backwards;transition:.25s;text-decoration:none;
}
.splash-enter:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 8px 44px rgba(0,212,255,.6)}
.splash-tap{
  display:none;margin-top:14px;padding:9px 22px;border-radius:999px;cursor:pointer;
  font-size:13px;letter-spacing:2px;color:#dff4ff;
  background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.45);
  backdrop-filter:blur(6px);animation:blink 2s ease-in-out infinite;
}
.splash-tap.show{display:inline-block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.splash-hint{
  margin-top:16px;font-size:11px;color:rgba(143,163,191,.7);letter-spacing:2px;
  animation:fadeUp 1.1s 1.7s ease backwards;
}
.splash-scan{
  position:absolute;left:0;right:0;height:120px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,212,255,.07),transparent);
  animation:scanMove 4s linear infinite;
}
@keyframes scanMove{0%{top:-140px}100%{top:110%}}
@media(max-width:520px){
  .splash-title{letter-spacing:6px}
  .splash-sub{letter-spacing:8px}
}
/* ===== 回到顶部 ===== */
.to-top{
  position:fixed;right:24px;bottom:24px;z-index:85;width:46px;height:46px;border-radius:14px;
  border:1px solid var(--line);background:rgba(17,28,48,.9);color:var(--accent);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.25s;
  opacity:0;visibility:hidden;transform:translateY(12px);backdrop-filter:blur(8px);
}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top:hover{border-color:var(--accent);box-shadow:0 0 18px rgba(0,212,255,.35);background:rgba(0,212,255,.12);transform:translateY(-2px)}
.to-top svg{width:20px;height:20px}
/* ===== 页脚 ===== */
footer{max-width:1280px;margin:0 auto;padding:26px 20px 34px;text-align:center;color:var(--dim2);font-size:12px;letter-spacing:1px;border-top:1px solid var(--line)}
/* ===== 响应式 ===== */
@media(max-width:860px){
  .d-body{grid-template-columns:1fr}
  .d-img{min-height:230px}
  .d-img::after{background:linear-gradient(0deg,transparent 55%,rgba(14,22,38,.8))}
  .search{width:100%;order:3}
  .search input{width:100%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}
@media(max-width:520px){
  .grid{grid-template-columns:1fr;padding:0 14px}
  .hd-inner{padding:12px 14px}
  .logo h1{font-size:17px}
  .filters,.stats{padding:0 14px}
}
</style>
</head>
<body>

<!-- ===== 开场大屏 ===== -->
<div class="splash" id="splash">
  <video autoplay muted loop playsinline webkit-playsinline x5-playsinline preload="auto" poster="video_poster.jpg" id="splashVideo">
    <source src="video_boom_3s.mp4" type="video/mp4">
  </video>
  <div class="splash-scan"></div>
  <div class="splash-body">
    <div class="splash-tag">✦ AGNES AI CINEMATIC ✦</div>
    <h2 class="splash-title">全球空军图鉴</h2>
    <div class="splash-sub">AIRPOWER ATLAS</div>
    <div class="splash-brand">POWERED BY <b>TOOBEY</b> × HERMES</div>
    <div class="splash-line"></div>
    <button class="splash-enter" onclick="enterSplash()">✦ 进入图鉴 ✦</button>
    <div class="splash-tap" id="splashTap" onclick="tapPlay()">▶ 轻触屏幕播放视频</div>
    <div class="splash-hint">收录 504 架机型 · 88 个国家/地区 · 9 大类别</div>
  </div>
</div>

<header>
  <div class="hd-inner">
    <div class="logo">
      <div class="logo-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04121a" stroke-width="2" stroke-linecap="round">
          <path d="M2 12h20M12 2c3 4 3 10 0 20-3-10-3-16 0-20z"/>
          <path d="M12 2v20M2 12h20"/>
        </svg>
      </div>
      <div>
        <h1>全球空军图鉴 <em>·</em> AIRPOWER <em style="color:#ffd700">-</em> <em style="color:#ffd700">Toobey</em></h1>
        <p>WORLD MILITARY AIRCRAFT ENCYCLOPEDIA</p>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8fa3bf" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

/* ================= 状态 ================= */
let curC="all", curT="all", cmp=[], curList=[], curIdx=0;

/* ================= 渲染 ================= */
function setCountry(v){curC=v;render()}
function setT(el){
  document.querySelectorAll('#typeScroll .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); curT=el.dataset.t; render();
}

const CC={中国:'var(--cn)',美国:'var(--us)',俄罗斯:'var(--ru)',欧洲:'var(--eu)'};

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const list=PLANES.filter(p=>
    (curC==='all'||p.country===curC)&&(curT==='all'||p.type===curT)&&
    (!q||p.name.toLowerCase().includes(q)||p.en.toLowerCase().includes(q)||
     p.country.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)||
     (p.tags||[]).join(' ').toLowerCase().includes(q))
  );
  const g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="empty">暂无匹配机型</div>';curList=[];return;}
  curList=list;
  g.innerHTML=list.map((p,i)=>`
  <div class="card" style="animation-delay:${Math.min(i*40,800)}ms" onclick="openDetail('${p.id}')">
    <div class="img-wrap">
      <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.classList.add('show')">
      <div class="gen-badge"><div class="gen-ring"></div><b>AI 生成中</b><span>AGNES · ${p.id}</span></div>
      <span class="c-flag" style="background:${CC[p.country]||'#8fa3bf'}22;color:${CC[p.country]||'#8fa3bf'};border:1px solid ${CC[p.country]||'#8fa3bf'}55">${p.country}</span>
      <span class="c-type">${p.type}</span>
      <span class="c-cmp ${cmp.includes(p.id)?'on':''}" onclick="event.stopPropagation();toggleCmp('${p.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <div class="c-info">
        <div class="c-name">${p.name}<small>${(p.en||'').split(' ').slice(0,2).join(' ')}</small></div>
        <div class="c-specs"><span>速度 <b>${p.speed}</b></span><span>航程 <b>${(p.range||'').replace('约','')}</b></span></div>
      </div>
    </div>
  </div>`).join('');
}

/* ================= 详情 ================= */
function openDetail(id){
  const p=PLANES.find(x=>x.id===id); if(!p)return;
  curIdx=Math.max(curList.findIndex(x=>x.id===id),0);
  const rows=[['制造商',p.manu],['任务定位',p.role],['乘员',p.crew],['首飞时间',p.first],
    ['服役时间',p.serve],['最大速度',p.speed],['作战航程',p.range],['实用升限',p.ceiling],
    ['武器/载重',p.load],['机身长度',p.len],['翼展',p.span]];
  const hasPrev=curList.length&&curIdx>0, hasNext=curList.length&&curIdx<curList.length-1;
  document.getElementById('detailBox').innerHTML=`
  <button class="d-close" onclick="closeDetail()">✕</button>
  <div class="d-body">
    <div class="d-img">
      <img src="${p.img}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.classList.add('show')">
      <div class="gen-badge"><div class="gen-ring"></div><b>AI 生成中</b><span>AGNES · ${p.id}</span></div>
    </div>
    <div class="d-main">
      <span class="d-flag" style="background:${CC[p.country]}22;color:${CC[p.country]};border:1px solid ${CC[p.country]}55">${p.country} · ${p.type}</span>
      <h2 class="d-name">${p.name}</h2>
      <div class="d-en">${p.en}</div>
      <div class="d-desc"><p>${p.desc}</p>${p.desc2?`<p>${p.desc2}</p>`:''}</div>
      <div class="d-tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
      <div class="d-nav">
        <button class="d-nav-btn" ${hasPrev?'':'disabled'} onclick="prevDetail()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          上一页
        </button>
        <div class="d-nav-ind">
          <b>${curList.length?curIdx+1:0}</b> / ${curList.length||0}
          <span class="d-nav-kbd">← →</span>
        </div>
        <button class="d-nav-btn" ${hasNext?'':'disabled'} onclick="nextDetail()">
          下一页
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>`;
  document.getElementById('ovD').classList.add('show');
  document.getElementById('detailBox').scrollTop=0;
}
function prevDetail(){if(curIdx>0){openDetail(curList[curIdx-1].id)}}
function nextDetail(){if(curIdx<curList.length-1){openDetail(curList[curIdx+1].id)}}
function closeDetail(){document.getElementById('ovD').classList.remove('show')}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDetail();document.getElementById('ovC').classList.remove('show');}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&document.getElementById('ovD').classList.contains('show')){
    e.preventDefault();
    if(e.key==='ArrowLeft')prevDetail();else nextDetail();
  }
});

/* ================= 对比 ================= */
function toggleCmp(id){
  const i=cmp.indexOf(id);
  if(i>=0)cmp.splice(i,1);else if(cmp.length<4)cmp.push(id);
  syncCmpBar();render();
}
function syncCmpBar(){
  const bar=document.getElementById('cmpbar');
  document.getElementById('cmpthumbs').innerHTML=cmp.map(id=>{
    const p=PLANES.find(x=>x.id===id);
    return `<div class="thumb"><img src="${p.img}"><i onclick="toggleCmp('${id}')">✕</i></div>`;
  }).join('');
  bar.classList.toggle('show',cmp.length>0);
  document.getElementById('cmpgo').disabled=cmp.length<2;
}
function openCompare(){
  if(cmp.length<2)return;
  const sel=cmp.map(id=>PLANES.find(x=>x.id===id));
  const rows=[['国家',p=>p.country],['类型',p=>p.type],['制造商',p=>p.manu],['首飞',p=>p.first],
    ['服役',p=>p.serve],['速度',p=>p.speed],['航程',p=>p.range],['升限',p=>p.ceiling],
    ['载重',p=>p.load],['长度',p=>p.len],['翼展',p=>p.span]];
  document.getElementById('cmpBox').innerHTML=`
  <button class="cmp-close" onclick="document.getElementById('ovC').classList.remove('show')">✕</button>
  <h3>机型参数对比</h3>
  <table>
    <tr><th>项目</th>${sel.map(p=>`<th class="${p.country==='中国'?'cn':p.country==='美国'?'us':p.country==='俄罗斯'?'ru':'eu'}">${p.name}</th>`).join('')}</tr>
    ${rows.map(r=>`<tr><td>${r[0]}</td>${sel.map(p=>`<td>${r[1](p)}</td>`).join('')}</tr>`).join('')}
  </table>`;
  document.getElementById('ovC').classList.add('show');
}

/* ================= 统计条 & 国家下拉 ================= */
(function(){
  const n=PLANES.length;
  const cs=[...new Set(PLANES.map(p=>p.country))].sort((a,b)=>a.localeCompare(b,'zh'));
  const ts=new Set(PLANES.map(p=>p.type)).size;
  const sel=document.getElementById('countrySel');
  cs.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});
  document.getElementById('countryCount').textContent=cs.length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="n">${n}</div><div class="t">收录机型</div></div>
    <div class="stat"><div class="n">${cs.length}</div><div class="t">国家/地区</div></div>
    <div class="stat"><div class="n">${ts}</div><div class="t">机型类别</div></div>
    <div class="stat"><div class="n" style="color:#ffd700">2026</div><div class="t">数据截至</div></div>`;
})();

/* ================= 开场大屏 ================= */
function enterSplash(){
  var v=document.getElementById('splashVideo');
  // 先启动视频（用户手势解锁播放），让用户看到视频动起来，再延迟淡出
  if(v&&v.paused){var p=v.play();if(p&&p.catch){p.catch(function(){})}}
  var btn=document.querySelector('.splash-enter');
  if(btn){btn.disabled=true;btn.style.opacity=.5;}
  setTimeout(function(){
    document.getElementById('splash').classList.add('hide');
    document.body.style.overflow='';
  },1000);
}
// 回到顶部按钮：滚动600px后浮现
window.addEventListener('scroll',function(){
  document.getElementById('toTop').classList.toggle('show',window.scrollY>600);
},{passive:true});
// 视频加载失败时保持大屏可用（背景降级）
document.addEventListener('DOMContentLoaded',function(){
  var v=document.getElementById('splashVideo');
  if(v){
    // 移动端 autoplay 兜底：JS 强制播放（微信/iPhone 需要）
    var tryPlay=function(){var p=v.play();if(p&&p.catch){p.catch(function(){})}};
    tryPlay();
    v.addEventListener('loadeddata',tryPlay);
    v.addEventListener('canplay',tryPlay);
    // 播放成功则隐藏"轻触播放"提示
    v.addEventListener('playing',function(){document.getElementById('splashTap').classList.remove('show')});
    // autoplay 被拦截时显示提示（200ms后仍暂停）
    setTimeout(function(){if(v.paused){document.getElementById('splashTap').classList.add('show')}},600);
    document.addEventListener('touchstart',function(){tryPlay()},{once:true,passive:true});
    document.addEventListener('click',function(){tryPlay()},{once:true});
    v.addEventListener('error',function(){
      document.querySelector('.splash').style.background='radial-gradient(ellipse at 50% 40%,#0e2238,#04080f 75%)';
    });
  }
});
function tapPlay(){
  var v=document.getElementById('splashVideo');
  if(v){var p=v.play();if(p&&p.catch){p.catch(function(){})}}
  document.getElementById('splashTap').classList.remove('show');
}

render();
</script>
